<div class="dashboard-container">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="side" [opened]="true" [ngClass]="{'collapsed': isCollapsed}">
      <div class="sidebar-logo">
        <img src="images/LOGOGHOST_ONLYPNG_PURPLE.png" alt="Logo" class="sidebar-logo-img">
        <img src="images/LETTERING_FINAL_PURPLE.png" alt="Letter" class="sidebar-letter">
      </div>
      <div class="sidebar-divider"></div>
      <h6 [ngClass]="{'collapsed-header': isCollapsed}">My APP</h6>
      <mat-nav-list class="mat-nav-list">
        <mat-list-item class="nav-button" (click)="showSection('createcommunity'); $event.preventDefault()">
          <mat-icon>add</mat-icon>
          <span class="nav-text">Create Community</span>
        </mat-list-item>
        <mat-list-item class="nav-button" (click)="showSection('home'); $event.preventDefault()">
            <mat-icon>home</mat-icon>
            <span class="nav-text">Home</span>
        </mat-list-item>
        <mat-list-item class="nav-button" (click)="showSection('library'); $event.preventDefault()">
            <mat-icon>local_library</mat-icon>
            <span class="nav-text">Library</span>
        </mat-list-item>
        <!-- <mat-list-item>
          <a mat-button class="nav-button" href="#" (click)="showSection('timeline'); $event.preventDefault()">Community Testing</a>
        </mat-list-item>
        <mat-list-item>
          <a mat-button class="nav-button" href="#" (click)="showSection('workspace'); $event.preventDefault()">workspace</a>
        </mat-list-item> -->
      </mat-nav-list>
      <div class="sidebar-divider"></div>
      <app-communitylist [isCollapsed]="isCollapsed" (sectionChange)="onSectionChange($event)"></app-communitylist>

      <img src="images/LETTERING_FINAL_PURPLE.png" alt="letter" class="sidebar-footer-letter" [ngClass]="{'collapsed-content': isCollapsed}">

    </mat-sidenav>


    <mat-sidenav-content class="content-area" [ngClass]="{'collapsed-content': isCollapsed}">
      <mat-toolbar color="primary" class="toolbar">
        <button mat-icon-button (click)="toggleNavbar()">
          &nbsp;<mat-icon>menu</mat-icon>&nbsp;
        </button>
        <app-toolbar [currentSection]="selectedSection"></app-toolbar>

        <!-- Sección de perfil -->
        <ng-container *ngIf="cookieExists">
          <button mat-icon-button [matMenuTriggerFor]="profileMenu">
            <img [src]="imgUrl" alt="Perfil" class="user-avatar" />
          </button>

          <mat-menu #profileMenu="matMenu" class="general-menu">
            <div class="profile-info">
              <span class="user-name">{{ arrUsr().user }}</span>
              <span class="user-email">{{ arrUsr().mail }}</span>
            </div>

          <div class="divider-container">
            <mat-divider></mat-divider>
            <img [src]="imgUrl" alt="Perfil" class="divider-avatar">
          </div>

          
          <button mat-menu-item (click)="showSection('profile')">
            <mat-icon class="menu-button">person</mat-icon>
            My Profile
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onLogout()">
            <mat-icon style="color: red;" class="menu-button">logout</mat-icon>
            <span style="color: red;">Logout</span>
          </button>
        </mat-menu>
        </ng-container>
      </mat-toolbar>


      <div class="content-wrapper">
        <ng-container class="nav-community-list">
          <router-outlet></router-outlet>
        </ng-container>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
